<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Focusloop | Pomodoro timer with a study log</title>
<meta name="description" content="A pomodoro timer that logs what you studied, shows today's focus time, your streak and a 7-day chart. Offline, no signup.">
<meta property="og:title" content="Focusloop"><meta property="og:description" content="Pomodoro timer with a study log, streak and weekly chart."><meta property="og:image" content="og.png"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="og.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23ff5a3c'/%3E%3Ccircle cx='50' cy='50' r='24' fill='%23fff6ea'/%3E%3C/svg%3E">
<style>
:root{--r:#ff5a3c;--cream:#fff6ea;--ink:#2a1a14;--g:#2f9e6b}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.5 "Avenir Next","Nunito","Segoe UI",system-ui,sans-serif}
body.break{--r:#2f9e6b;background:#eefaf3}
.w{max-width:960px;margin:0 auto;padding:24px 18px 50px}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
h1{margin:0;font-size:28px;letter-spacing:-.5px}h1 b{color:var(--r)}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.pill{background:#fff;border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;box-shadow:0 2px 0 #0001}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px}
@media(max-width:780px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border-radius:28px;padding:24px;box-shadow:0 6px 0 #2a1a1412}
.modes{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.modes button{border:0;background:#f3e6d8;border-radius:999px;padding:8px 16px;font:700 14px inherit;font-family:inherit;cursor:pointer;color:var(--ink)}
.modes button.on{background:var(--r);color:#fff}
.ring{position:relative;width:280px;height:280px;margin:22px auto}
.ring svg{transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.time{font-size:68px;font-weight:800;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.lbl{color:#8a6f60;font-size:14px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}
.go{border:0;background:var(--r);color:#fff;font:800 18px inherit;font-family:inherit;padding:12px 34px;border-radius:999px;cursor:pointer;box-shadow:0 5px 0 #0003}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #0003}
.ghost{border:2px solid #e6d5c4;background:#fff;border-radius:999px;padding:10px 18px;font:700 14px inherit;font-family:inherit;cursor:pointer;color:var(--ink)}
input[type=text],input[type=number]{border:2px solid #e6d5c4;border-radius:14px;padding:10px 14px;font:16px inherit;font-family:inherit;background:#fffdfa;color:var(--ink)}
input[type=text]{width:100%;margin-top:16px}
input[type=number]{width:64px;padding:6px 8px}
h2{margin:0 0 10px;font-size:18px}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;margin:14px 0 6px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:#8a6f60}
.bar i{display:block;width:100%;background:var(--r);border-radius:8px 8px 3px 3px;min-height:3px;opacity:.9}
.bar.today i{background:var(--ink)}
.log{list-style:none;margin:10px 0 0;padding:0;max-height:200px;overflow:auto}
.log li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px dashed #e6d5c4;font-size:14px}
.log button{border:0;background:none;color:#b89f90;cursor:pointer;font-size:16px}
.muted{color:#8a6f60;font-size:13px}
</style></head><body>
<div class="w">
<header><h1>Focus<b>loop</b></h1><div class="stats"><span class="pill" id="sToday">Today 0 min</span><span class="pill" id="sStreak">Streak 0 days</span><span class="pill" id="sCount">0 sessions</span></div></header>
<div class="grid">
<section class="card">
 <div class="modes" id="modes"><button data-m="focus" class="on">Focus</button><button data-m="short">Short break</button><button data-m="long">Long break</button></div>
 <div class="ring"><svg width="280" height="280" viewBox="0 0 280 280"><circle cx="140" cy="140" r="124" fill="none" stroke="#f3e6d8" stroke-width="16"/><circle id="arc" cx="140" cy="140" r="124" fill="none" stroke="var(--r)" stroke-width="16" stroke-linecap="round" stroke-dasharray="779.1" stroke-dashoffset="0"/></svg>
 <div class="t"><div class="time" id="time">25:00</div><div class="lbl" id="lbl">Ready to focus</div></div></div>
 <div class="row"><button class="go" id="go">Start</button><button class="ghost" id="reset">Reset</button></div>
 <input type="text" id="subj" placeholder="What are you studying? (e.g. Data Structures)" maxlength="60">
 <div class="row" style="margin-top:14px"><label class="muted">Focus <input type="number" id="mF" min="1" max="180" value="25"> min</label><label class="muted">Short <input type="number" id="mS" min="1" max="60" value="5"></label><label class="muted">Long <input type="number" id="mL" min="1" max="90" value="15"></label></div>
</section>
<section class="card">
 <h2>Last 7 days (minutes)</h2><div class="bars" id="bars"></div>
 <h2 style="margin-top:22px">Sessions</h2><ul class="log" id="log"></ul>
 <p class="muted" id="empty">Finish a focus session and it shows up here. Data stays in this browser.</p>
</section>
</div></div>
<script>
const $=s=>document.querySelector(s),KEY='focusloop.v1';
let mode='focus',total=1500,left=1500,end=0,run=false,tick=null,mins={focus:25,short:5,long:15};
let log=JSON.parse(localStorage.getItem(KEY)||'[]');
const day=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.max(0,Math.ceil(s%60))).padStart(2,'0');
function save(){localStorage.setItem(KEY,JSON.stringify(log))}
function draw(){
 $('#time').textContent=fmt(left);$('#arc').style.strokeDashoffset=779.1*(1-left/total);
 document.title=(run?fmt(left)+' | ':'')+'Focusloop';
 document.body.classList.toggle('break',mode!=='focus');
}
function setMode(m){mode=m;stop();total=left=mins[m]*60;document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));$('#lbl').textContent=m==='focus'?'Ready to focus':'Take a break';$('#go').textContent='Start';draw()}
function stop(){run=false;clearInterval(tick)}
function beep(){try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=660;g.gain.setValueAtTime(.2,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+1.2);o.start();o.stop(a.currentTime+1.2)}catch(e){}}
function done(){
 stop();beep();
 if(mode==='focus'){log.unshift({t:Date.now(),m:mins.focus,s:$('#subj').value.trim()||'Study'});save();render();setMode(log.filter(x=>day(x.t)===day(Date.now())).length%4===0?'long':'short')}
 else setMode('focus');
 $('#lbl').textContent='Done. Start when ready';
}
function loop(){left=(end-Date.now())/1000;if(left<=0){left=0;draw();done();return}draw()}
$('#go').onclick=()=>{
 if(run){left=Math.max(0,(end-Date.now())/1000);stop();$('#go').textContent='Resume';$('#lbl').textContent='Paused';draw();return}
 end=Date.now()+left*1000;run=true;tick=setInterval(loop,250);$('#go').textContent='Pause';$('#lbl').textContent=mode==='focus'?'Stay with it':'Breathe';
 if('Notification' in window&&Notification.permission==='default')try{Notification.requestPermission()}catch(e){}
};
$('#reset').onclick=()=>setMode(mode);
$('#modes').onclick=e=>{if(e.target.dataset.m)setMode(e.target.dataset.m)};
for(const [id,k] of [['mF','focus'],['mS','short'],['mL','long']])$('#'+id).onchange=e=>{mins[k]=Math.max(1,Math.min(180,+e.target.value||1));if(mode===k&&!run)setMode(k)};
function render(){
 const now=new Date(),by={};log.forEach(x=>by[day(x.t)]=(by[day(x.t)]||0)+x.m);
 const days=[];for(let i=6;i>=0;i--){const d=new Date(now);d.setDate(now.getDate()-i);days.push(d)}
 const mx=Math.max(30,...days.map(d=>by[day(d)]||0));
 $('#bars').innerHTML=days.map((d,i)=>{const v=by[day(d)]||0;return `<div class="bar${i===6?' today':''}"><span>${v||''}</span><i style="height:${v/mx*100}%"></i><span>${d.toLocaleDateString('en',{weekday:'short'})}</span></div>`}).join('');
 $('#sToday').textContent='Today '+(by[day(now)]||0)+' min';
 let st=0,d=new Date(now);if(!by[day(d)])d.setDate(d.getDate()-1);while(by[day(d)]){st++;d.setDate(d.getDate()-1)}
 $('#sStreak').textContent='Streak '+st+(st===1?' day':' days');$('#sCount').textContent=log.length+(log.length===1?' session':' sessions');
 $('#log').innerHTML=log.slice(0,30).map((x,i)=>`<li><span><b>${x.s.replace(/[<>&]/g,'')}</b> <span class="muted">${new Date(x.t).toLocaleDateString('en',{month:'short',day:'numeric'})} ${new Date(x.t).toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit'})}</span></span><span>${x.m} min <button data-i="${i}" title="Delete">×</button></span></li>`).join('');
 $('#empty').style.display=log.length?'none':'block';
}
$('#log').onclick=e=>{const i=e.target.dataset.i;if(i!==undefined){log.splice(+i,1);save();render()}};
if(location.search.includes('demo=1')){
 const subs=['Data Structures','Calculus','English','Networks','Data Structures','Databases'],n=Date.now(),H=36e5;log=[];
 [[0,[25,25,50]],[1,[25,50,50,25]],[2,[25,25]],[3,[50,50,25]],[4,[25]],[5,[25,25,25,50]],[6,[50,25]]].forEach(([b,l],j)=>l.forEach((m,k)=>log.push({t:n-b*24*H-k*H*1.5-H*(b?2:0.2),m,s:subs[(j+k)%6]})));
 log.sort((a,b)=>b.t-a.t);$('#subj').value='Data Structures';left=18*60+42;total=1500;
}
render();draw();
</script></body></html>
